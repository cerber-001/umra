<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Где группа · JURT</title>
<meta name="description" content="Карта группы паломников в Мекке и Медине: где свои, точки сбора, «Я потерялся», время азана, перекличка">
<meta name="theme-color" content="#00292C">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
@font-face{font-family:'Exo 2';src:url(../exo2-regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Exo 2';src:url(../exo2-semibold.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Exo 2';src:url(../exo2-bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Amiri';src:url(../amiri-400.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--sea:#005A5C;--deep:#00292C;--sun:#F07A1E;--bg:#F3F6F6;--ink:#0E2224;--mute:#5C7072;--line:#DDE6E6;--soft:#E6F0F0;--red:#C8372D}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 'Exo 2',system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}
#map{position:fixed;inset:0;background:#E9EEEE}
header{position:fixed;left:0;right:0;top:0;z-index:500;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(160deg,var(--deep),var(--sea));color:#fff}
header h1{flex:1;margin:0;font-size:17px;line-height:1.15;font-weight:700;min-width:0}
header h1 small{display:block;font-weight:400;font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
#top{position:fixed;z-index:600;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#top>*{pointer-events:auto}
#top>.chips{pointer-events:none;display:flex;flex-wrap:wrap;gap:6px}
body.sheeton #top>:not(#sos):not(#net){display:none!important}   /* сигнал «нужна помощь» виден всегда */
#banner{display:none;background:#FFF6EE;border-left:3px solid var(--sun);border-radius:10px;padding:7px 10px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,41,44,.12)}
#meet{display:none;background:var(--sun);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px;box-shadow:0 2px 8px rgba(0,41,44,.2);cursor:pointer}
#meet small{display:block;font-weight:400;font-size:12px;opacity:.95}
#meet.go{background:var(--red);animation:pulseR 1.6s infinite}
#sos{display:none;background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#net{display:none;align-self:center;background:var(--deep);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#net.off{background:var(--red)}
#note{display:none;position:relative;background:#fff;border-left:4px solid var(--sea);border-radius:10px;padding:7px 36px 7px 10px;box-shadow:0 2px 8px rgba(0,41,44,.15);cursor:pointer}
#note small{display:block;color:var(--sea);font-weight:600;font-size:11.5px}
#noteTx{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
#note.full #noteTx{display:block}
#noteX{position:absolute;right:6px;top:6px;border:0;background:var(--soft);color:var(--sea);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1}
.chip{pointer-events:auto;border:0;background:rgba(255,255,255,.96);color:var(--deep);border-radius:999px;padding:5px 11px;font-size:12.5px;box-shadow:0 1px 6px rgba(0,41,44,.18);cursor:pointer}
.chip b{color:var(--sea)}
.chip.soon{background:var(--sun);color:#fff}.chip.soon b{color:#fff}
.chip.far{background:var(--deep);color:#fff}
#dock{position:fixed;z-index:500;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#dock>*{pointer-events:auto}
#near{align-self:flex-start;background:rgba(0,41,44,.88);color:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;display:none}
.row{display:flex;gap:8px}
.big{flex:1;border:0;border-radius:14px;padding:14px 10px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 10px rgba(0,41,44,.25)}
#lost{background:var(--sun);color:#fff}
.sec{flex:none;width:auto;padding:14px;background:#fff;color:var(--sea);border:1px solid var(--line);font-size:14px}
#me{position:fixed;z-index:500;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--sea);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,41,44,.18)}
.sheet{position:fixed;z-index:700;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,41,44,.25);transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet h2{margin:0 0 6px;font-size:18px;color:var(--deep)}
.sheet h3{margin:16px 0 4px;font-size:16px;color:var(--deep)}
.sheet .x{float:right;border:0;background:var(--soft);color:var(--sea);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.sheet p{margin:6px 0;color:#2A3D3F;font-size:14px}
.mute{color:var(--mute);font-size:12.5px}
.sheet p.mute{color:var(--mute);font-size:12.5px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.b{display:block;text-align:center;border:0;border-radius:12px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.b.o{background:var(--sun);color:#fff}
.b.s{background:var(--sea);color:#fff}
.b.l{background:var(--soft);color:var(--sea)}
.b.r{background:#FBE9E7;color:var(--red)}
.b.big2{padding:18px;font-size:18px}
.target{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:14px;padding:12px;margin:10px 0}
.arrow{flex:none;width:64px;height:64px;border-radius:50%;background:var(--sea);display:grid;place-items:center;transition:transform .3s}
.arrow svg{width:34px;height:34px}
.target b{display:block;font-size:17px;color:var(--deep)}
.target .d{font-size:26px;font-weight:700;color:var(--sun);line-height:1.1}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tchips button{border:1px solid var(--line);background:#fff;color:var(--sea);border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer}
.tchips button.on{background:var(--sea);color:#fff;border-color:var(--sea)}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:13px;color:var(--sea)}
input[type=text],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);font-size:16px}
textarea{min-height:84px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:13.5px}
.chk input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--sea)}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--soft);font-size:14px}
.list li:first-child{border-top:0}
.list li.hd{display:block;font-weight:700;color:var(--sea);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:12px 0 2px;border-top:0}
.list .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.list .ago{color:var(--mute);font-size:12px;white-space:nowrap}
.list button{border:0;background:var(--soft);color:var(--sea);border-radius:8px;padding:5px 9px;font-weight:600;font-size:12.5px;cursor:pointer}
.list button.x{background:none;color:var(--mute);font-size:18px;padding:2px 6px}
.tag{display:inline-block;background:#FBE9E7;color:var(--red);border-radius:6px;padding:0 5px;font-size:11px;font-weight:700;margin-left:5px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--sea)}
.dot.old{background:#B9C6C7}.dot.sos{background:var(--red)}.dot.lead{background:var(--deep)}.dot.me{background:var(--sun)}
.dot.gone{background:#fff;border:2px dashed #9AAAAC}
.langs{display:flex;gap:6px;margin-top:10px}
.langs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;color:var(--sea);font-weight:600;cursor:pointer}
.langs button.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:#fff;color:var(--sea);padding:9px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--sea);color:#fff}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tpl button{border:1px solid var(--line);background:var(--soft);color:var(--sea);border-radius:10px;padding:6px 9px;font-size:12.5px;cursor:pointer;text-align:left}
.prt{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}
.prt td{padding:8px 4px;border-top:1px solid var(--soft)}
.prt td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.prt tr.nx td{color:var(--sun);font-weight:700}
.prt tr.past td{color:var(--mute)}
.pol{font:400 27px/1.55 'Amiri',serif;color:var(--deep);text-align:right;margin-top:10px}
.pol .ltr{direction:ltr;unicode-bidi:isolate;font:700 22px 'Exo 2',sans-serif}
.pol-en{color:var(--mute);font-size:13px;border-bottom:1px solid var(--soft);padding-bottom:6px}
/* метки на карте */
.pin{display:flex;flex-direction:column;align-items:center;transform:translateY(-6px);cursor:pointer}
.pin i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:#fff;font:700 12px 'Exo 2',sans-serif;font-style:normal;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pin span{margin-top:2px;background:rgba(255,255,255,.92);color:var(--deep);font:600 11px 'Exo 2',sans-serif;padding:1px 5px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pin.old i{background:#9AAAAC}.pin.lead i{background:var(--deep)}
.pin.sos i{background:var(--red);animation:pulse 1s infinite}
.pin.self i{background:var(--sun);animation:pulse 2s infinite}
.pin.gone i{background:#fff;color:#7D8D8F;border:2px dashed #9AAAAC;box-shadow:none}
.pin.gone span{color:var(--mute)}
.flag{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.flag i{display:grid;place-items:center;width:26px;height:26px;border-radius:6px 6px 6px 0;background:#fff;color:var(--sun);border:2px solid var(--sun);font:700 13px 'Exo 2',sans-serif;font-style:normal;transform:rotate(-45deg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.flag i b{transform:rotate(45deg)}
.flag span{margin-top:4px;background:var(--sun);color:#fff;font:600 11px 'Exo 2',sans-serif;padding:1px 6px;border-radius:5px;white-space:nowrap}
.flag.meet i{background:var(--sun);color:#fff;width:32px;height:32px}
.gl,.wc{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer;text-align:center}
.gl{min-width:20px;height:18px;padding:0 4px;border-radius:5px;background:rgba(255,255,255,.93);border:1px solid var(--sea);color:var(--sea);font:700 10.5px/16px 'Exo 2',sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.gl.main{background:var(--sea);color:#fff;font-size:11.5px;height:20px;line-height:18px}
.wc{height:16px;padding:0 4px;border-radius:4px;background:var(--deep);color:#fff;font:700 9.5px/16px 'Exo 2',sans-serif;opacity:.9}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,122,30,.55)}70%{box-shadow:0 0 0 14px rgba(240,122,30,0)}100%{box-shadow:0 0 0 0 rgba(240,122,30,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(200,55,45,.5)}70%{box-shadow:0 0 0 10px rgba(200,55,45,0)}100%{box-shadow:0 0 0 0 rgba(200,55,45,0)}}
.leaflet-container{font-family:'Exo 2',sans-serif}
.leaflet-control-attribution{font-size:10px}
.leaflet-top{top:calc(60px + env(safe-area-inset-top))}
.leaflet-bottom{bottom:calc(76px + env(safe-area-inset-bottom))}
#toast{position:fixed;z-index:800;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);color:#fff;padding:8px 14px;border-radius:16px;font-size:13px;display:none;max-width:90vw;text-align:center}
#toast.act{cursor:pointer;background:var(--sun);font-weight:600;padding:10px 16px}
.wc.poi{font-size:10px}
#tRt{display:block;margin-top:2px;font-size:12px}
#cLink{font-size:13px;margin:6px 0}
body.sheeton #toast{bottom:auto;top:calc(64px + env(safe-area-inset-top))}   /* при открытой шторке — сверху, чтобы не закрывать кнопки */
/* ---- v2.18 «как iPhone»: один экран — одно главное. Старые плашки остаются в DOM (на них завязана логика), но не показываются ---- */
#meet,#near,#top>.chips,#note,#banner,#addBtn,#tCall{display:none!important}
#now{display:none;background:#fff;color:var(--ink);border-radius:16px;padding:12px 44px 12px 14px;box-shadow:0 4px 14px rgba(0,41,44,.18);cursor:pointer;font-weight:700;font-size:16px;line-height:1.25;border-left:6px solid var(--sea);position:relative}
#now small{display:block;font-weight:500;font-size:13px;color:var(--mute);margin-top:3px}
#now .nx{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--sea);font-weight:400}
#now.meet{border-left-color:var(--sun)}
#now.go{border-left-color:var(--red);animation:pulseR 1.6s infinite}
#now.ask{background:var(--sun);color:#fff;border-left-color:#fff}
#now.ask small,#now.ask .nx{color:#fff}
#now.note{border-left-color:var(--sun);white-space:pre-wrap}
#avatars{display:none;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#avatars::-webkit-scrollbar{display:none}
.av{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--sea);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,41,44,.2);position:relative;font-family:inherit}
.av.off{background:#9AA9AA}
.av.lead{box-shadow:0 0 0 3px var(--sun),0 2px 6px rgba(0,41,44,.2)}
.av.lead::after{content:"★";position:absolute;top:-10px;right:-6px;font-size:14px;color:var(--sun);text-shadow:0 0 3px #fff,0 0 3px #fff}
.av.sos{background:var(--red);animation:pulseR 1.6s infinite}
#lost{background:var(--red);min-height:60px;font-size:19px;border-radius:18px}
#leadPlus{display:none;position:fixed;z-index:500;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--sun);color:#fff;font-size:36px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,41,44,.3);font-family:inherit}
#leadPlus.on{display:block}
body.sheeton #leadPlus{display:none}
#leadS .b{padding:18px;font-size:18px}
#join.simple .adv{display:none!important}
#join:not(.simple) .smp{display:none!important}
#join.simple #jGo{padding:18px;font-size:19px}
#jCode{font-weight:700;color:var(--sea);font-size:15px;margin:0 0 8px;letter-spacing:.02em}
#iLead{display:block;width:100%;text-align:center;color:var(--mute);font-size:13px;margin-top:16px;text-decoration:underline;cursor:pointer;background:none;border:0;font-family:inherit}
#join .chk{margin-top:10px;font-size:13.5px}
#lostS .target{flex-direction:column;text-align:center;gap:10px;padding:16px 12px}
#lostS .arrow{width:108px;height:108px}
#lostS .arrow svg{width:58px;height:58px}
#lostS .target .d{font-size:40px}
#lostS .target b{font-size:19px}
#lostS #lP{font-size:17px;line-height:1.35;color:var(--deep);font-weight:600;white-space:pre-line}
#lostS .btns .b,#ptS .btns .b,#askS .btns .b{padding:17px 14px;font-size:17px;min-height:56px}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <a class="hb" href="../" data-t="back">← Гид</a>
  <h1><span data-t="title">Где группа</span><small id="sub"></small></h1>
  <button class="hb" id="menuBtn" aria-label="Настройки" title="Настройки" style="font-size:18px;padding:3px 11px">⚙</button>
</header>
<div id="top">
  <div id="sos"></div>
  <div id="net"></div>
  <div id="now"></div>
  <div id="avatars"></div>
  <div id="note"><button id="noteX" aria-label="×">×</button><small id="noteBy"></small><div id="noteTx"></div></div>
  <div id="meet"></div>
  <div class="chips"><button class="chip" id="prChip"></button><button class="chip soon" id="askChip" style="display:none"></button><button class="chip far" id="farChip" style="display:none"></button></div>
  <div id="banner"></div>
</div>
<button id="me" aria-label="Моё место">◎</button>
<button id="leadPlus" aria-label="+">＋</button>
<div id="dock">
  <div id="near"></div>
  <div class="row">
    <button class="big" id="lost" data-t="lost">Я потерялся</button>
    <button class="big sec" id="addBtn" data-t="add">+ Точка</button>
  </div>
</div>
<div id="toast"></div>

<!-- Вход в группу -->
<section class="sheet" id="join">
  <h2 data-t="joinH">Где группа</h2>
  <p class="smp" id="jCode"></p>
  <p class="adv" data-t="joinP"></p>
  <div class="adv"><label class="f" for="jGroup" data-t="code">Код группы</label>
  <input type="text" id="jGroup" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="UMRA-0009-…" maxlength="40"></div>
  <label class="f" for="jName" data-t="name">Ваше имя</label>
  <input type="text" id="jName" autocomplete="given-name" maxlength="24">
  <div class="btns"><button class="b s" id="jGo" data-t="start">Начать</button></div>
  <label class="chk"><input type="checkbox" id="jShare" checked><span class="adv" data-t="consent"></span><span class="smp" data-t="consent1"></span></label>
  <div class="langs" id="jLangs"></div>
  <p class="mute adv" data-t="joinNote"></p>
  <div class="btns adv"><button class="b l" id="jNew" data-t="create"></button></div>
  <p class="mute adv" data-t="createNote"></p>
  <button type="button" class="smp" id="iLead" data-t="iLead">Я руководитель</button>
</section>

<!-- Я потерялся / Куда идти -->
<section class="sheet" id="lostS">
  <button class="x" data-close>×</button>
  <h2 id="lH"></h2>
  <p id="lP" data-t="lostP"></p>
  <div class="tchips" id="tChips"></div>
  <div class="target"><div class="arrow" id="arrow"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 1l7 9h-4.5v13h-5V10H5z"/></svg></div>
    <div><b id="tName">—</b><span class="d" id="tDist">—</span> <span class="mute" id="tDir"></span><span class="mute" id="tRt"></span></div></div>
  <p class="mute" id="tGate"></p>
  <div class="btns">
    <a class="b s big2" id="tLead" data-t="callLead"></a>
    <a class="b s" id="tWa" target="_blank" rel="noopener" data-t="wa"></a>
    <button class="b l" id="tPol" data-t="police"></button>
    <button class="b o" id="tFound" data-t="found"></button>
    <button class="b r" id="tCall" data-t="call"></button>
    <a class="b l" id="tWalk" target="_blank" rel="noopener" data-t="walk"></a>
  </div>
  <p class="mute" id="lTip" data-t="lostTip"></p>
</section>

<!-- Руководителю: «＋» на карте -->
<section class="sheet" id="leadS">
  <button class="x" data-close>×</button>
  <h2 data-t="leadTools"></h2>
  <div class="btns">
    <button class="b o" id="lsMeet" data-t="makeMeet"></button>
    <button class="b s" id="lsRoll" data-t="roll"></button>
    <button class="b s" id="lsNote" data-t="noteH"></button>
  </div>
  <p class="mute" data-t="leadHint"></p>

  ask(t("coLead"), t("coLeadWarn"), () => shareLink(inviteUrl() + (k ? "#lk=" + k : ""), t("inviteTxt")));
};
$("mWipe").onclick = () => ask(t("wipe"), t("wipeQ"), async () => {
  try { await bus.wipe(); } catch (e) { toast(t("err") + e.message, 5000); }
  loadPoints(); loadNotes();
});
$("mLeave").onclick = () => {
  if (bus) { bus.signal("forget", { id: me.id }); bus.bye(); }
  ls.set("group", ""); setTimeout(() => location.href = location.pathname, 300);
};

// ---------- Точки сбора: ставят руководитель и сами участники ----------
let editing = null;
function editPoint(p) {
  const own = p && (lead || p.by === me.id) && !isDefault(p);
  editing = p || null;
  $("pH").textContent = p ? p.name : t("newPt");
  $("pP").style.display = p ? "none" : "";
  $("pName").value = p ? p.name : ""; $("pTime").value = p && p.meet ? p.meet : "";
  $("pName").disabled = !!p && !own;
  $("pMeetBox").style.display = lead ? "block" : "none";
  $("pGo").style.display = p ? "" : "none";
  $("pSave").style.display = !p || own || lead ? "" : "none";
  $("pSave").textContent = p && !own ? t("makeMeet") : t("save");
  $("pDel").style.display = own ? "" : "none";
  sheet("ptS");
  if (p) map.flyTo(p.ll, Math.max(map.getZoom(), 18));
}
$("addBtn").onclick = () => { if (bus) editPoint(null); };
$("pGo").onclick = () => { const p = editing; if (p) openGo(p.meet ? { ...p, k: "meet" } : p, false); };
$("pSave").onclick = async () => {
  const p = editing, own = p && (lead || p.by === me.id) && !isDefault(p);
  const raw = $("pTime").value.trim(), mt = raw.match(/^(\d{1,2})[:.](\d{2})$/);
  const time = mt && +mt[1] < 24 && +mt[2] < 60 ? pad2(+mt[1]) + ":" + mt[2] : null;
  if (lead && raw && !time) { toast(t("timeBad")); return; }
  const c = map.getCenter();
  const pt = p && !own ? { ...p, id: isDefault(p) ? p.id + "-" + group : p.id, by: p.by || me.id }   // точку по умолчанию руководитель делает местом сбора
                       : { id: p ? p.id : rid(10), name: $("pName").value.trim().slice(0, 60) || t("newPt"), ll: p ? p.ll : [c.lat, c.lng], by: p ? p.by : me.id };
  pt.meet = lead ? time : (p && p.meet) || null;
  if (!inRange(pt.ll)) { toast(t("ptRange"), 4000); return; }
  try { await bus.savePoint(pt); } catch (e) { toast(t("err") + e.message, 5000); return; }
  if (pt.meet) { myMeet = sigOf(localize({ ...pt })); toast(t("meetSet")); }
  sheet(null); loadPoints();
};
$("pDel").onclick = async () => {
  if (editing && bus) { try { await bus.delPoint(editing.id); } catch (e) { toast(t("err") + e.message, 5000); return; } }
  sheet(null); loadPoints();
};

// ---------- Вход ----------
async function enter(isNew) {
  ls.set("group", group); ls.set("name", me.name);
  sheet(null);
  gone = ls.get("gone." + group, {}); pruneGone();
  notes = ls.get("notes." + group, []);
  const rs = ls.get("roll." + group, null);
  if (lead && rs && rs.roll && Date.now() - rs.roll.t < 30 * 60000) { roll = rs.roll; acks = rs.acks || {}; }
  if (LIVE) {
    try { bus = await liveBus(isNew); }
    catch (e) { toast("Supabase: " + e.message, 6000); if (isNew) { bus = null; ls.set("group", ""); $("jGroup").value = group.replace(/-[A-Z0-9]{6}$/, ""); $("jName").value = me.name; sheet("join"); return false; } bus = demoBus(); }
    const j = bus.joined;
    if (j && !j.ok) { bus.close(); bus = null; ls.set("group", ""); toast(t("noGroup"), 7000); $("jGroup").value = group; $("jName").value = me.name; sheet("join"); return false; }
    if (j) lead = !!j.lead;   // права руководителя подтверждает база по ключу
  } else bus = demoBus();
  ls.set("lead." + group, lead);
  await Promise.all([loadPoints(), loadNotes()]);
  if (me.share && !tripOver()) startGps();
  initBattery();
  publish(true); render(); netRender();
  return true;
}
function joinGo(isNew) {
  let code = normCode($("jGroup").value);
  me.name = $("jName").value.trim().slice(0, 24);
  if (!me.name) { toast(t("needName")); $("jName").focus(); return; }
  if (isNew) { code = (code.replace(/-+$/, "").slice(0, 30) || "JURT") + "-" + rid(6, "23456789ABCDEFGHJKMNPQRSTUVWXYZ"); ls.set("lk." + code, rid(24)); }   // случайный хвост — код не угадать; ключ руководителя — только на этом телефоне
  if (!code) { toast(t("need")); return; }
  if (!CODE_RE.test(code)) { toast(t("codeBad"), 4000); return; }
  group = code; lead = isNew || !!ls.get("lk." + group, null) || ls.get("lead." + group, false);
  me.share = $("jShare").checked; ls.set("share", me.share);
  enter(isNew).then((ok) => { if (ok && isNew) { toast(t("created"), 5000); sheet("menuS"); renderMenu(); } });
}
$("jGo").onclick = () => joinGo(false);
$("jNew").onclick = () => joinGo(true);
$("jGroup").onblur = (e) => { e.target.value = normCode(e.target.value); };

setInterval(() => {
  prayerTick(); renderMeet(); renderNow();
  if (curAsk && Date.now() - curAsk.t > 30 * 60000) closeAsk();
  pruneGone();
}, 20000);
applyLang(); drawPlaces(); prayerTick(); render(); rtLoad(city);
if (group && me.name && CODE_RE.test(group)) { lead = !!ls.get("lk." + group, null) || ls.get("lead." + group, false); enter(false); }
else { $("jGroup").value = group; $("jName").value = me.name; joinMode(!!group && CODE_RE.test(group)); sheet("join"); }
</script>
</body>
</html>
