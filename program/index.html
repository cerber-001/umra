<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Программа умры · JURT</title>
<meta name="description" content="Программа тура: умра 28.10–06.11.2026 — Стамбул, Медина, Мекка, Дубай">
<meta name="theme-color" content="#00292C">
<meta name="robots" content="noai, noimageai">
<meta name="copyright" content="© 2026 JURT Group. Все права защищены">
<meta property="og:title" content="Программа умры · октябрь 2026">
<meta property="og:description" content="Стамбул · Медина · Мекка · Дубай — 28.10–06.11.2026">
<meta property="og:image" content="https://umra.jurt.kz/og-image.png">
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'Exo 2';src:url(../exo2-regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Exo 2';src:url(../exo2-semibold.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Exo 2';src:url(../exo2-bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--sea:#005A5C;--deep:#00292C;--sun:#F07A1E;--bg:#F3F6F6;--card:#fff;--ink:#0E2224;--mute:#5C7072;--line:#DDE6E6;--soft:#E6F0F0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Exo 2',system-ui,sans-serif}
header{background:linear-gradient(160deg,var(--deep),var(--sea));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}
.hw{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:26px}
.acts{display:flex;gap:8px}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:600 13px 'Exo 2',sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.18)}
h1{font-size:26px;line-height:1.15;margin:18px 0 4px;font-weight:700}
.sub{opacity:.85;font-size:14px}
.grp{opacity:.7;font-size:12.5px;margin-top:6px}
.tbadge{display:inline-block;background:var(--sun);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:4px;margin-left:6px;vertical-align:middle}
nav{position:sticky;top:0;z-index:5;background:rgba(243,246,246,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.chips{max-width:860px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font:600 12px 'Exo 2',sans-serif;color:var(--sea);text-decoration:none;text-align:center;line-height:1.2}
.chip small{display:block;font-weight:400;color:var(--mute);font-size:10.5px}
.chip.today{background:var(--sun);border-color:var(--sun);color:#fff}
.chip.today small{color:#fff}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.legend{font-size:12.5px;color:var(--mute);margin:6px 2px 14px}
.day{background:var(--card);border-radius:16px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,41,44,.06);scroll-margin-top:70px}
.day.today{outline:2px solid var(--sun)}
.dh{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--soft)}
.dd{flex:none;width:52px;text-align:center;background:var(--soft);border-radius:10px;padding:5px 0;color:var(--sea)}
.dd b{display:block;font-size:20px;line-height:1.1}
.dd span{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.day.today .dd{background:var(--sun);color:#fff}
.dt h2{margin:0;font-size:17px;line-height:1.25}
.dt .meta{font-size:12px;color:var(--mute);margin-top:2px}
.pr{font-size:12px;color:var(--sea);background:var(--soft);padding:6px 16px}
.it{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--soft)}
.it:first-of-type{border-top:0}
.tm{font-weight:700;color:var(--sea);font-size:13.5px;font-variant-numeric:tabular-nums}
.pl{font-weight:600}
.w{color:#2A3D3F}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--bg);color:var(--mute)}
.tag.who{background:#E9F2F2;color:var(--sea)}
.tag.pay{background:#FFF1E6;color:#A2470A}
.tag.st{background:var(--sun);color:#fff;font-weight:600}
.it.tonly{background:#FFFAF5}
.note{font-size:13px;color:var(--mute);padding:8px 16px 12px;border-top:1px solid var(--soft)}
.tnote{font-size:13px;background:#FFF6EE;border-left:3px solid var(--sun);padding:8px 14px;margin:0;border-top:1px solid var(--soft)}
.tnote b{color:#A2470A}
.team-only{display:none}
body.team .team-only{display:block}
.dec{background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px}
.dec h2{font-size:16px;margin:0 0 8px}
.dec li{margin:6px 0}
.dec .s{font-size:11.5px;color:#A2470A;font-weight:600}
.rule{font-size:12.5px;color:var(--mute);margin:-6px 2px 14px}
footer{text-align:center;font-size:12px;color:var(--mute);padding:10px 16px 30px}
footer a{color:var(--sea)}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:600 13px 'Exo 2',sans-serif;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3)}
.back svg{width:16px;height:16px}
.lg{display:flex;align-items:center;gap:10px}
.inc{background:#fff;border-radius:16px;margin:0 0 14px;overflow:hidden}
.inc summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;color:var(--sea);display:flex;justify-content:space-between;align-items:center}
.inc summary::-webkit-details-marker{display:none}
.inc summary:after,.it summary:after{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin:-4px 2px 0 10px;flex:none}
.inc[open] summary:after,.it details[open] summary:after{transform:rotate(-135deg);margin-top:4px}
.incb{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;padding:0 16px 14px;font-size:13.5px}
.incb h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 4px;color:var(--mute)}
.incb ul{margin:0;padding-left:18px}
.incb li{margin:3px 0}
.it details summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between}
.it details summary::-webkit-details-marker{display:none}
.it details summary:after{color:var(--sun);margin-top:6px}
.it details[open] summary:after{margin-top:12px}
.more{margin-top:6px;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:13.5px;color:#2A3D3F}
.more p{margin:0 0 6px}.more p:last-child{margin:0}
.tag.own{background:#FFF1E6;color:#A2470A}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:420px){.it{grid-template-columns:78px 1fr}h1{font-size:23px}.btn{padding:7px 10px}}
@media (max-width:560px){.incb{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:12mm 11mm}
 body{background:#fff;font-size:10.5pt}
 header{background:var(--deep)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:10px 14px;border-radius:8px}
 .acts,nav,.toast,footer .fx,.back,.it summary:after{display:none!important}
 .inc summary:after{display:none}
 .more{background:none;padding:2px 0 0;font-size:9.5pt}
 h1{font-size:18pt;margin:6px 0 2px}
 main{padding:6px 0;max-width:none}
 .day{box-shadow:none;border:1px solid var(--line);border-radius:8px;break-inside:auto;margin:0 0 8px;outline:0!important}
 .dh{break-after:avoid}
 .it{break-inside:avoid;padding:5px 12px;grid-template-columns:84px 1fr}
 .dd,.pr,.tag,.tnote,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .day.today .dd{background:var(--soft);color:var(--sea)}
}
</style>
</head>
<body>
<header><div class="hw">
 <div class="top"><div class="lg"><a class="back" id="back" href="../" aria-label="Вернуться в гид паломника"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Гид</a><img src="../logo-white.svg" alt="JURT"></div>
  <div class="acts"><button class="btn" id="share">Поделиться</button><button class="btn" onclick="print()">Печать / PDF</button></div></div>
 <h1 id="ttl">Программа умры</h1>
 <div class="sub" id="sub"></div>
 <div class="grp" id="grp"></div>
</div></header>
<nav><div class="chips" id="chips"></div></nav>
<main id="m"><p class="legend">Загрузка программы…</p></main>
<footer><span id="ver"></span> · <a class="fx" href="../">Гид паломника</a></footer>
<div class="toast" id="toast"></div>
<script>
(function(){
 var TEAM = /[?&]team\b/.test(location.search);
 if (TEAM) document.body.classList.add('team');
 var DOW = ['вс','пн','вт','ср','чт','пт','сб'], MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
 function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
 fetch('program.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(render).catch(function(){
  document.getElementById('m').innerHTML='<p class="legend">Не удалось загрузить программу. Проверьте интернет и обновите страницу.</p>'});
 function render(P){
  var T=today(), chips='', out='';
  document.getElementById('ttl').innerHTML=esc(P.title)+(TEAM?'<span class="tbadge">КОМАНДА</span>':'');
  document.getElementById('sub').textContent=P.subtitle;
  document.getElementById('grp').textContent=P.group;
  document.getElementById('ver').textContent='Версия: '+P.version+' от '+P.updated;
  out+='<p class="legend">'+esc(P.legend)+'</p>';
  if (P.incl) {
   var li=function(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
   out+='<details class="inc"><summary>Что входит в стоимость</summary><div class="incb"><div><h3>Входит</h3>'+li(P.incl)+'</div><div><h3>За свой счёт</h3>'+li(P.excl)+'</div></div></details>';
  }
  if (TEAM) {
   out+='<p class="rule">'+esc(P.pay_rule)+'</p><section class="dec"><h2>Открытые решения</h2><ul>';
   P.decisions.forEach(function(d){out+='<li><b>'+esc(d.q)+'.</b> '+esc(d.rec)+' <span class="s">→ '+esc(d.st)+'</span></li>'});
   out+='</ul></section>';
  }
  P.days.forEach(function(d,i){
   var dt=new Date(d.date+'T12:00:00'), isT=d.date===T, n=dt.getDate(), dow=DOW[dt.getDay()], mon=MON[dt.getMonth()];
   chips+='<a class="chip'+(isT?' today':'')+'" href="#'+d.id+'">'+n+' '+mon+'<small>'+esc(d.city)+'</small></a>';
   out+='<section class="day'+(isT?' today':'')+'" id="'+d.id+'"><div class="dh"><div class="dd"><b>'+n+'</b><span>'+mon+' · '+dow+'</span></div>'+
    '<div class="dt"><h2>'+(i&&i<P.days.length-1?'День '+i+' · ':'')+esc(d.title)+'</h2><div class="meta">'+esc(d.city)+' · '+esc(d.tz)+(isT?' · <b style="color:var(--sun)">сегодня</b>':'')+'</div></div></div>';
   if (d.pr) out+='<div class="pr">🕌 '+esc(d.pr)+'</div>';
   d.items.forEach(function(it){
    if (it.team && !TEAM) return;
    var tags='';
    if (it.tr) tags+='<span class="tag">'+esc(it.tr)+'</span>';
    if (TEAM && it.who) tags+='<span class="tag who">'+esc(it.who)+'</span>';
    if (TEAM && it.pay) tags+='<span class="tag pay">платит: '+esc(it.pay)+'</span>';
    else if (it.pay==='свои') tags+='<span class="tag own">за свой счёт</span>';
    if (TEAM && it.st) tags+='<span class="tag st">'+esc(it.st)+'</span>';
    var head='<div class="pl">'+esc(it.p)+'</div><div class="w">'+esc(it.w)+'</div>';
    var body=it.m ? '<details><summary><div>'+head+'</div></summary><div class="more">'+it.m.split('\n').map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div></details>' : head;
    out+='<div class="it'+(it.team?' tonly':'')+'"><div class="tm">'+esc(it.t)+'</div><div>'+body+(tags?'<div class="tags">'+tags+'</div>':'')+'</div></div>';
   });
   (d.notes||[]).forEach(function(t){out+='<div class="note">'+esc(t)+'</div>'});
   if (TEAM) (d.team||[]).forEach(function(t){out+='<p class="tnote"><b>Команде:</b> '+esc(t)+'</p>'});
   out+='</section>';
  });
  document.getElementById('chips').innerHTML=chips;
  document.getElementById('m').innerHTML=out;
  if (!location.hash) { var t=document.querySelector('.day.today'); if (t) t.scrollIntoView(); var c=document.querySelector('.chip.today'); if (c) c.scrollIntoView({inline:'center',block:'nearest'}); }
  else { var h=document.querySelector(location.hash); if (h) h.scrollIntoView(); }
 }
 document.getElementById('back').onclick=function(e){
  var r=document.referrer; if (r && r.indexOf(location.origin)===0 && r.indexOf('/program')<0 && history.length>1) { e.preventDefault(); history.back(); }
 };
 // при печати раскрываем «Что входит», подробности остаются свёрнутыми
 window.addEventListener('beforeprint',function(){var i=document.querySelector('.inc'); if(i) i.open=true});
 document.getElementById('share').onclick=function(){
  var url=location.origin+location.pathname; // делимся всегда публичной версией, без ?team
  if (navigator.share) navigator.share({title:'Программа умры · октябрь 2026',url:url}).catch(function(){});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){toast('Ссылка скопирована')});
  else prompt('Ссылка на программу:',url);
 };
})();
</script>
</body>
</html>
