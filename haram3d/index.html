const $ = (id) => document.getElementById(id);
const toV3 = (x, y, z = 0) => new THREE.Vector3(x, z, -y);   // Blender (север = +Y) → three.js

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
if (!renderer.getContext()) { $("fallback").style.display = "block"; throw new Error("no webgl"); }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$("bg").after(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 14; controls.maxDistance = 1100;
controls.maxPolarAngle = THREE.MathUtils.degToRad(84);
controls.screenSpacePanning = false;

scene.add(new THREE.HemisphereLight(0xfff4e2, 0x2a3a3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-60, 120, 70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 400 });
sun.shadow.bias = -0.0004;
scene.add(sun);

// Мягкое свечение (вместо пост-обработки): радиальная текстура для спрайтов и точек
function glowTex() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.55)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();
const glowSprite = (color, size, opacity = 1) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.setScalar(size); return s;
};

const [gltf, meta] = await Promise.all([
  new GLTFLoader().loadAsync("haram.glb"),
  fetch("haram_meta.json").then((r) => r.json()),
]);
$("load").remove();

const occluders = [];
let startMat = null;
gltf.scene.traverse((o) => {
  if (!o.isMesh) return;
  const m = o.material;
  m.flatShading = true;
  if (m.name === "kiswa") { m.color.set(0x0b0c0d); m.roughness = 0.75; m.metalness = 0; }
  if (m.name === "gold") { m.color.set(0xd4af37); m.metalness = 1; m.roughness = 0.28; m.emissiveIntensity = 0.15; }
  if (m.name === "start") { startMat = m; m.emissive.set(0xf07a1e); }
  o.castShadow = ["kiswa", "gold", "marble", "minaret"].includes(m.name);
  o.receiveShadow = true;
  occluders.push(o);
});
scene.add(gltf.scene);

// Зелёная лампа — ореол
const gl = meta.spots.green_lamp;
const lampGlow = glowSprite(0x4dff8a, 9); lampGlow.position.copy(toV3(gl[0], gl[1], gl[2])); scene.add(lampGlow);

// ---------- Таваф: фигурки в ихраме (инстансы) идут против часовой по дорожкам из Blender ----------
const lanes = meta.lanes.map((l) => {
  const p = l.pts.map(([x, y]) => new THREE.Vector2(x, y));
  const cum = [0];
  for (let i = 1; i <= p.length; i++) cum.push(cum[i - 1] + p[i % p.length].distanceTo(p[i - 1]));
  return { d: l.d, p, cum, L: cum[cum.length - 1] };
});
function along(lane, s, out) {
  s = ((s % lane.L) + lane.L) % lane.L;
  let lo = 0, hi = lane.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (lane.cum[m] <= s) lo = m; else hi = m; }
  const a = lane.p[lo], b = lane.p[(lo + 1) % lane.p.length];
  const t = (s - lane.cum[lo]) / (lane.cum[lo + 1] - lane.cum[lo] || 1);
  out.set(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
  out.tx = b.x - a.x; out.ty = b.y - a.y;
  return out;
}
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const walkers = [];
for (const lane of lanes) {
  const spacing = 1.55 + 0.035 * lane.d, n = Math.floor(lane.L / spacing), fill = 0.97 - 0.006 * lane.d;
  for (let i = 0; i < n; i++) if (rnd() < fill)
    walkers.push({ lane, s0: i * spacing + rnd() * 0.5, off: (rnd() - 0.5) * 0.9, v: 1.15 + rnd() * 0.35 });
}
const bodyGeo = new THREE.CylinderGeometry(0.24, 0.4, 1.78, 9).translate(0, 0.89, 0);
const headGeo = new THREE.SphereGeometry(0.16, 10, 6).translate(0, 1.95, 0);
const bodies = new THREE.InstancedMesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0xfbfaf6, roughness: 0.8,
  emissive: 0xffffff, emissiveIntensity: 0.06, flatShading: true }), walkers.length);
const heads = new THREE.InstancedMesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xd2ae88, roughness: 0.8 }), walkers.length);
bodies.castShadow = heads.castShadow = true;
scene.add(bodies, heads);
const tmpV = new THREE.Vector2(), mtx = new THREE.Matrix4();
const SPEED = 1.6;   // ускорено ×1,3 к реальному шагу, чтобы движение читалось
function placeWalkers(t) {
  for (let i = 0; i < walkers.length; i++) {
    const w = walkers[i], p = along(w.lane, w.s0 + t * w.v * SPEED, tmpV);
    const l = Math.hypot(p.tx, p.ty) || 1, nx = p.ty / l, ny = -p.tx / l;
    mtx.makeTranslation(p.x + nx * w.off, 0, -(p.y + ny * w.off));
    bodies.setMatrixAt(i, mtx); heads.setMatrixAt(i, mtx);
  }
  bodies.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true;
}

// ---------- Эффекты: медные кометы по кругу + мерцающие искры ----------
const comets = [0, Math.floor(lanes.length / 2), lanes.length - 2].map((li, k) => {
  const g = new THREE.Group(), parts = [];
  for (let j = 0; j < 26; j++) {
    const s = glowSprite(0xffb76b, 2.6 * (1 - j / 30) * (1 + lanes[li].d / 50), 1 - j / 28);
    g.add(s); parts.push(s);
  }
  scene.add(g);
  return { lane: lanes[li], parts, phase: k / 3 };
});
const SPARKS = 160, sparkPos = new Float32Array(SPARKS * 3), sparkCol = new Float32Array(SPARKS * 3), sparkPh = [];
const outerD = lanes[lanes.length - 1].d;
for (let i = 0; i < SPARKS; i++) {
  const r = 8 + rnd() * (outerD + 10), a = rnd() * Math.PI * 2;
  sparkPos.set([r * Math.cos(a), 3 + rnd() * 30, -r * Math.sin(a)], i * 3); sparkPh.push(rnd() * Math.PI * 2);
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute("color", new THREE.BufferAttribute(sparkCol, 3));
scene.add(new THREE.Points(sparkGeo, new THREE.PointsMaterial({ map: GLOW, size: 1.6, vertexColors: true,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })));

// ---------- Эффекты шагов ----------
// «Вы» — оранжевая фигурка с ореолом (таваф) или маяк над галереей (саи)
const youMat = new THREE.MeshStandardMaterial({ color: 0xf07a1e, emissive: 0xf07a1e, emissiveIntensity: 0.9, roughness: 0.5 });
const you = new THREE.Group(), youFig = new THREE.Group();
youFig.add(new THREE.Mesh(bodyGeo, youMat), new THREE.Mesh(headGeo, youMat));
const youGlow = glowSprite(0xff9a3c, 7, 0.9); youGlow.position.y = 1.2;
const youDot = new THREE.Mesh(new THREE.SphereGeometry(3.2, 20, 14), youMat);   // на саи — плотный шарик, ореол на светлой крыше слабый
youDot.position.y = 1.2;
you.add(youFig, youGlow, youDot); you.visible = false; scene.add(you);
// старт тавафа — точка дорожки, ближайшая к линии «Чёрный камень → зелёная лампа»
const youLane = lanes[4];
const youS0 = (() => {
  const [A, E] = meta.start, ex = E[0] - A[0], ey = E[1] - A[1], l2 = ex * ex + ey * ey;
  let best = Infinity, bs = 0;
  youLane.p.forEach((p, i) => {
    const t = Math.max(0, ((p.x - A[0]) * ex + (p.y - A[1]) * ey) / l2), dx = p.x - A[0] - ex * t, dy = p.y - A[1] - ey * t;
    if (dx * dx + dy * dy < best) { best = dx * dx + dy * dy; bs = youLane.cum[i]; }
  });
  return bs;
})();
const LAP = 6, SAI_LEG = 5;   // секунд на круг / на проход — сжатое время, чтобы показать все 7
// Кольцо за Макамом — место 2 ракаатов
const mq = new THREE.Vector2(meta.spots.maqam[0], meta.spots.maqam[1]), mqOut = mq.clone().normalize();
const ring = new THREE.Mesh(new THREE.RingGeometry(2.0, 2.8, 48).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xf07a1e, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
ring.position.copy(toV3(mq.x + mqOut.x * 3.2, mq.y + mqOut.y * 3.2, 2.6)); ring.visible = false; scene.add(ring);
// Замзам: медная кромка матафа + огоньки кулеров
const edge = lanes[lanes.length - 1];
const zamzam = new THREE.Group();
for (let k = 0; k < 90; k++) {   // медная кромка из огоньков, каждый 6-й — кулер (голубой, крупнее)
  const c = k % 6 === 0, g = glowSprite(c ? 0x1fa9c9 : 0xf07a1e, c ? 6 : 3);
  g.material.blending = THREE.NormalBlending;   // на светлом мраморе аддитивное свечение не видно
  g.position.copy(toV3(...along(edge, k / 90 * edge.L, tmpV).toArray(), c ? 2.5 : 1.2)); g.userData.c = c; zamzam.add(g);
}
zamzam.visible = false; scene.add(zamzam);
// Саи: оранжевая дорожка по крыше Мас'а (в модели это блок высотой 30 м) от Сафы до Марвы
const saiPath = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(toV3(135.83, -75.36, 30.6), toV3(91.41, 301.79, 30.6)), 8, 1.4, 8),
  new THREE.MeshBasicMaterial({ color: 0xf07a1e, transparent: true, opacity: 0.75, depthWrite: false }));
saiPath.visible = false; scene.add(saiPath);
// Завершение: медный салют над Каабой
const BURST = 180, burstPos = new Float32Array(BURST * 3), burstVel = [];
for (let i = 0; i < BURST; i++) {
  const a = rnd() * Math.PI * 2, u = rnd() * 0.9 + 0.1;
  burstVel.push(new THREE.Vector3(Math.cos(a) * u, 1.2 + rnd() * 0.8, Math.sin(a) * u).multiplyScalar(26 + rnd() * 18));
}
const burstGeo = new THREE.BufferGeometry(); burstGeo.setAttribute("position", new THREE.BufferAttribute(burstPos, 3));
const burstMat = new THREE.PointsMaterial({ map: GLOW, size: 9, color: 0xe9a06a, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false });
const burst = new THREE.Points(burstGeo, burstMat); burst.visible = false; burst.frustumCulled = false; scene.add(burst);

let fx = null, counterTxt = "";
function setFx(name) {
  fx = name;
  you.visible = name === "tawaf" || name === "sai" || name === "halq";
  youFig.visible = name === "tawaf"; youDot.visible = name === "sai" || name === "halq";
  you.scale.setScalar(name === "tawaf" ? 1.3 : 1);
  youGlow.scale.setScalar(name === "tawaf" ? 7 : 22);
  youGlow.material.blending = name === "tawaf" ? THREE.AdditiveBlending : THREE.NormalBlending;   // на светлом полу аддитивное не видно
  saiPath.visible = name === "sai" || name === "halq";
  ring.visible = name === "maqam"; zamzam.visible = name === "zamzam"; burst.visible = name === "finish";
  setCounter("");
}
function setCounter(t) {
  if (t === counterTxt) return;
  counterTxt = t; $("counter").textContent = t; $("counter").style.display = t ? "block" : "none";
}
const saiA = new THREE.Vector3(), saiB = new THREE.Vector3(), followV = new THREE.Vector3();
function updateFx(dt) {
  if (!fx) return;
  fxT += dt;
  const pulse = 0.5 + 0.5 * Math.sin(fxT * 4);
  if (fx === "tawaf") {
    const k = Math.min(fxT / LAP, 7), p = along(youLane, youS0 + k * youLane.L, tmpV);
    you.position.set(p.x, 0, -p.y);
    youGlow.material.opacity = 0.6 + 0.4 * pulse;
    setCounter(k >= 7 ? "Таваф завершён — 7 кругов ✓" : `Круг ${Math.floor(k) + 1} из 7${k < 3 ? " · рамаль" : ""}`);
  } else if (fx === "sai" || fx === "halq") {
    saiA.copy(safaV).setY(33); saiB.copy(marwaV).setY(33);
    if (fx === "halq") {   // перед куполом Марвы (он выше крыши Мас'а) — пульсирующая метка
      you.position.lerpVectors(saiA, saiB, 0.93); you.scale.setScalar(1 + 0.35 * pulse); setCounter("");
    }
    else {
      const k = Math.min(fxT / SAI_LEG, 7), leg = Math.min(Math.floor(k), 6), u = k >= 7 ? 1 : k - leg;
      you.position.lerpVectors(leg % 2 ? saiB : saiA, leg % 2 ? saiA : saiB, u);
      setCounter(k >= 7 ? "Саи завершён на Марве ✓" : `Проход ${leg + 1} из 7 · ${leg % 2 ? "Марва → Сафа" : "Сафа → Марва"}`);
    }
    youGlow.material.opacity = 0.65 + 0.35 * pulse;
    if (fx === "sai" && !fly) {   // камера ведёт метку от Сафы к Марве, вращать пальцем можно по-прежнему
      const d = followV.copy(you.position).sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
      controls.target.add(d); camera.position.add(d);
    }
  } else if (fx === "maqam") {
    ring.scale.setScalar(1 + 0.25 * pulse); ring.material.opacity = 0.45 + 0.5 * pulse;
  } else if (fx === "zamzam") {
    zamzam.children.forEach((g, k) => { g.material.opacity = g.userData.c ? 0.55 + 0.45 * pulse : 0.3 + 0.7 * Math.max(0, Math.sin(fxT * 3 - k * 0.35)); });
  } else if (fx === "finish") {
    const t = fxT % 3.2;
    for (let i = 0; i < BURST; i++) {
      const v = burstVel[i];
      burstPos.set([v.x * t, 14 + v.y * t - 9 * t * t, v.z * t], i * 3);
    }
    burstGeo.attributes.position.needsUpdate = true;
    burstMat.opacity = Math.max(0, 1 - t / 3.2);
  }
}

// ---------- Точки-подсказки и карточки ----------
const spotEls = SPOTS.map((s, i) => {
  const b = document.createElement("button");
  b.className = "spot"; b.textContent = i + 1; b.setAttribute("aria-label", s.title);
  b.onclick = (e) => { e.stopPropagation(); openCard(i); };
  $("spots").append(b);
  const p = meta.spots[s.key];
  s.pos = toV3(p[0], p[1], p[2] + (["safa", "marwa"].includes(s.key) ? 30 : 0.6));
  return b;
});
let cur = -1, step = -1;   // открытая метка или открытый шаг (одновременно — что-то одно)
function showCard(tag, title, html) {
  $("ctag").textContent = tag; $("ctitle").innerHTML = title; $("ctext").innerHTML = html;
  $("card").scrollTop = 0;
  $("card").classList.add("open"); $("bar").style.opacity = 0; $("bar").style.pointerEvents = "none";
}
function openCard(i) {
  if (step >= 0) leaveSteps();
  cur = (i + SPOTS.length) % SPOTS.length;
  const s = SPOTS[cur];
  showCard(s.tag, `<b>${cur + 1}</b>${s.title}`, s.text);
  spotEls.forEach((e, k) => e.classList.toggle("sel", k === cur));
  flyTo(s.pos, s.dist);
}
function closeCard() {
  $("card").classList.remove("open"); $("bar").style.opacity = 1; $("bar").style.pointerEvents = "";
  spotEls.forEach((e) => e.classList.remove("sel")); cur = -1;
  if (step >= 0) leaveSteps();
}
$("close").onclick = closeCard;
$("next").onclick = () => step >= 0 ? openStep(step + 1) : openCard(cur + 1);
$("prev").onclick = () => step >= 0 ? openStep(step - 1) : openCard(cur - 1);

// ---------- Режим «8 шагов умры» ----------
const chipEls = STEPS.map((st, i) => {
  const b = document.createElement("button"); b.textContent = i + 1; b.setAttribute("aria-label", st.title);
  b.onclick = () => openStep(i); $("chips").append(b); return b;
});
const kaabaT = toV3(1, 3, 2), safaV = SPOTS[8].pos, marwaV = SPOTS[9].pos;
STEPS[0].view = [toV3(-90, 90, 0), 900, new THREE.Vector3(0.5, 0.72, 0.48)];
STEPS[1].view = [kaabaT, 240, new THREE.Vector3(0.75, 0.45, 0.5)];
STEPS[2].view = [kaabaT, 88, new THREE.Vector3(0.8, 0.75, -0.05)];
STEPS[3].view = [toV3(mq.x, mq.y, 2), 42, new THREE.Vector3(mqOut.x, 0.65, -mqOut.y)];
STEPS[4].view = [kaabaT, 175, new THREE.Vector3(0.55, 0.8, 0.45)];
STEPS[5].view = [safaV.clone().setY(33), 280, new THREE.Vector3(0.12, 0.8, 0.58)];   // с юга вдоль Мас'а, дальше камера ведёт метку — на телефоне путь идёт вверх по экрану
STEPS[6].view = [toV3(95, 285, 30), 230, new THREE.Vector3(0.12, 0.85, 0.5)];      // выход у Марвы, где бреют/стригут
STEPS[7].view = [toV3(-60, 60, 0), 820, new THREE.Vector3(0.5, 0.72, 0.48)];

let fxT = 0;
function openStep(i) {
  step = Math.max(0, Math.min(STEPS.length - 1, i)); cur = -1; fxT = 0;
  const st = STEPS[step];
  showCard(st.tag, `<b>${step + 1}</b>${st.title}`, st.text);
  $("prev").style.visibility = step ? "" : "hidden";
  $("next").textContent = step < STEPS.length - 1 ? "Далее →" : "Готово";
  $("next").onclick = () => step < STEPS.length - 1 ? openStep(step + 1) : closeCard();
  chipEls.forEach((e, k) => { e.classList.toggle("sel", k === step); e.classList.toggle("done", k < step); });
  spotEls.forEach((e) => e.classList.remove("sel"));
  $("chips").classList.add("on"); $("go").classList.add("on"); $("go").textContent = "Выйти";
  setFx(st.fx);
  flyTo(...st.view);
}
function leaveSteps() {
  step = -1; setFx(null);
  $("chips").classList.remove("on"); $("go").classList.remove("on"); $("go").textContent = "8 шагов умры";
  $("prev").style.visibility = ""; $("next").textContent = "Далее →";
  $("next").onclick = () => step >= 0 ? openStep(step + 1) : openCard(cur + 1);
}
$("go").onclick = () => step >= 0 ? closeCard() : openStep(0);

// Плавный перелёт камеры: цель и расстояние, направление взгляда сохраняется
let fly = null;
function flyTo(target, dist, dir) {
  const d = dir ? dir.clone().normalize() : camera.position.clone().sub(controls.target).normalize();
  if (d.y < 0.35) { d.y = 0.35; d.normalize(); }
  fly = { t0: performance.now(), dur: 1100, fromT: controls.target.clone(), fromC: camera.position.clone(),
    toT: target.clone(), toC: target.clone().add(d.multiplyScalar(dist)) };
}
const VIEWS = {
  kaaba: [toV3(1, 3, 2), 72, new THREE.Vector3(0.8, 0.58, -0.05)],
  haram: [toV3(-90, 90, 0), 900, new THREE.Vector3(0.5, 0.72, 0.48)],
  sai: [toV3(110, 110, 10), 430, new THREE.Vector3(0.85, 0.5, 0.15)],
};
document.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => {
  document.querySelectorAll("[data-view]").forEach((x) => x.classList.toggle("on", x === b));
  const [t, d, dir] = VIEWS[b.dataset.view]; flyTo(t, d, dir);
});
let playing = true;
$("play").onclick = () => { playing = !playing; $("play").textContent = (playing ? "❚❚" : "▶") + " Таваф"; };

{ const [t, d, dir] = VIEWS.kaaba; controls.target.copy(t); camera.position.copy(t).add(dir.clone().normalize().multiplyScalar(d)); }

// Видимость меток: прячем за зданиями (проверка лучом раз в несколько кадров)
const ray = new THREE.Raycaster(), proj = new THREE.Vector3();
let frame = 0;
function updateSpots() {
  const w = innerWidth, h = innerHeight, check = frame++ % 8 === 0;
  const far = camera.position.distanceTo(controls.target) > 260;   // издали метки у Каабы сливаются — оставляем 1, 9, 10
  SPOTS.forEach((s, i) => {
    const el = spotEls[i];
    proj.copy(s.pos).project(camera);
    if ((step >= 0 ? !STEPS[step].spots.includes(i) : far && i > 0 && i < 8 && cur !== i) || proj.z > 1 || Math.abs(proj.x) > 1.1 || Math.abs(proj.y) > 1.1) { el.classList.add("off"); return; }
    el.classList.remove("off");
    el.style.transform = `translate(${(proj.x + 1) / 2 * w}px, ${(1 - proj.y) / 2 * h}px)`;
    if (check) {
      const dir = s.pos.clone().sub(camera.position), dist = dir.length();
      ray.set(camera.position, dir.normalize()); ray.far = dist - 2.5;
      el.classList.toggle("hid", ray.intersectObjects(occluders, false).length > 0);
    }
  });
}

let simT = 0, last = performance.now(), viewShift = 0;
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) simT += dt;
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);
    controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromC, fly.toC, e);
    if (k >= 1) fly = null;
  }
  const want = $("card").classList.contains("open") ? 0.2 : 0;   // сдвигаем картинку вверх над карточкой
  if (Math.abs(want - viewShift) > 0.001) {
    viewShift += (want - viewShift) * Math.min(1, dt * 6);
    camera.setViewOffset(innerWidth, innerHeight, 0, viewShift * innerHeight, innerWidth, innerHeight);
  }
  controls.update();
  placeWalkers(simT);
  updateFx(dt);
  for (const c of comets) {
    const base = (c.phase + simT / 9) * c.lane.L;
    c.parts.forEach((s, j) => { const p = along(c.lane, base - j * 0.9, tmpV); s.position.set(p.x, 0.9, -p.y); });
  }
  for (let i = 0; i < SPARKS; i++) {
    const v = Math.max(0, Math.sin(simT * 1.6 + sparkPh[i])) ** 3;
    sparkCol.set([v, v * 0.93, v * 0.82], i * 3);
  }
  sparkGeo.attributes.color.needsUpdate = true;
  if (startMat) startMat.emissiveIntensity = 1.6 + Math.sin(simT * 3) * 0.9;
  lampGlow.material.opacity = 0.75 + Math.sin(simT * 2.2) * 0.25;
  renderer.render(scene, camera);
  updateSpots();
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; viewShift += 0.0011; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
renderer.domElement.addEventListener("pointerdown", () => { fly = null; });
</script>
