<style>
  /* Exo 2 локально (те же файлы, что в «Гиде паломника»), лицензия OFL */
  @font-face { font-family: "Exo 2"; font-weight: 400; font-display: swap; src: url(../exo2-regular.woff2) format("woff2"); }
  @font-face { font-family: "Exo 2"; font-weight: 600; font-display: swap; src: url(../exo2-semibold.woff2) format("woff2"); }
  @font-face { font-family: "Exo 2"; font-weight: 700; font-display: swap; src: url(../exo2-bold.woff2) format("woff2"); }
  :root {
    --sapphire: #005A5C; --deep: #00292C; --orange: #F07A1E; --copper: #E9A06A; --cream: #F4EDE1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--cream);
    font-family: "Exo 2", system-ui, sans-serif; }
  #bg { position: fixed; inset: 0; background: url(bg.webp) center/cover no-repeat; }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,20,22,.75) 100%); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
    background: linear-gradient(var(--deep), transparent); }
  header .back { pointer-events: auto; font: 600 13px "Exo 2", sans-serif; color: var(--cream); text-decoration: none;
    background: rgba(0,90,92,.85); border-radius: 10px; padding: 8px 10px; }
  header .brand { font-weight: 700; letter-spacing: .14em; color: var(--copper); font-size: 13px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 6px; padding: 5px; border-radius: 14px; background: rgba(0,41,44,.82);
    backdrop-filter: blur(8px); border: 1px solid rgba(233,160,106,.25); transition: opacity .25s; }
  .bar button { font: 600 13px "Exo 2", sans-serif; color: var(--cream); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .bar button.on { background: var(--sapphire); }
  .spot { position: fixed; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    display: grid; place-items: center; font: 700 14px "Exo 2", sans-serif; color: var(--deep);
    background: var(--cream); border: 2px solid var(--copper); cursor: pointer; padding: 0;
    box-shadow: 0 0 0 0 rgba(233,160,106,.6); animation: pulse 2.4s infinite; transition: opacity .2s; }
  .spot::before { content: ""; position: absolute; inset: -8px; }
  .spot.hid { opacity: .28; animation: none; }
  .spot.off { display: none; }
  .spot.sel { background: var(--orange); color: #fff; border-color: #fff; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233,160,106,.55); } 70% { box-shadow: 0 0 0 10px rgba(233,160,106,0); } 100% { box-shadow: 0 0 0 0 rgba(233,160,106,0); } }
  #card { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); max-width: 460px;
    margin: 0 auto; padding: 16px 16px 14px; border-radius: 18px; background: rgba(0,41,44,.94);
    border: 1px solid rgba(233,160,106,.35); backdrop-filter: blur(10px);
    transform: translateY(130%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  #card.open { transform: none; }
  #card .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--copper); }
  #card h2 { margin: 4px 36px 8px 0; font-size: 20px; line-height: 1.2; }
  #card h2 b { color: var(--orange); margin-right: 6px; }
  #card p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.45; color: #E8E1D4; }
  #card .dua { padding: 8px 10px; border-left: 3px solid var(--orange); background: rgba(0,90,92,.45);
    border-radius: 0 8px 8px 0; font-style: italic; }
  #card .nav { display: flex; justify-content: space-between; margin-top: 10px; }
  #card .nav button, #close { font: 600 13px "Exo 2", sans-serif; color: var(--cream); background: var(--sapphire);
    border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0; font-size: 18px; }
  #card { max-height: 58vh; overflow-y: auto; overscroll-behavior: contain; }
  #card .src { font-size: 12px; color: rgba(244,237,225,.62); }
  header .go { margin-left: auto; pointer-events: auto; font: 600 13px "Exo 2", sans-serif; color: #fff;
    background: var(--orange); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  header .go.on { background: var(--sapphire); }
  #chips { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 42px); left: 0; right: 0; display: none;
    justify-content: center; gap: 6px; padding: 0 12px; }
  #chips.on { display: flex; }
  #chips button { width: 32px; height: 32px; border-radius: 50%; padding: 0; font: 700 13px "Exo 2", sans-serif;
    color: var(--cream); background: rgba(0,41,44,.85); border: 1px solid rgba(233,160,106,.45); cursor: pointer; }
  #chips button.done { background: var(--sapphire); }
  #chips button.sel { background: var(--orange); border-color: #fff; color: #fff; }
  #counter { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 84px); left: 50%; transform: translateX(-50%);
    display: none; padding: 6px 14px; border-radius: 20px; font: 600 14px "Exo 2", sans-serif; color: #fff;
    background: rgba(240,122,30,.92); white-space: nowrap; }
  #runTag { position: fixed; left: 0; top: 0; display: none; padding: 3px 9px; border-radius: 12px; pointer-events: none;
    font: 600 12px "Exo 2", sans-serif; color: var(--deep); background: #FFD27A; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #prog { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 120px); left: 50%; transform: translateX(-50%);
    width: min(300px, calc(100vw - 32px)); display: none; pointer-events: none;
    padding: 5px 10px 7px; border-radius: 12px; background: rgba(0,41,44,.82); }
  #prog.on { display: block; }
  #prog .lbl { font: 600 12px "Exo 2", sans-serif; color: var(--cream); text-align: center; margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #prog .trk { position: relative; height: 8px; border-radius: 4px; background: rgba(0,41,44,.85); border: 1px solid rgba(233,160,106,.4); overflow: hidden; }
  #prog .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #E9A06A, #FFD27A); }
  #prog .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,41,44,.9); }
  #card .note { font-size: 11px; color: rgba(244,237,225,.5); margin: 6px 0 0; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--copper); }
  #fallback { position: fixed; inset: 0; display: none; background: url(poster.webp) center/cover; }
</style>
</head>

<header><a class="back" href="../" aria-label="Вернуться в «Гид паломника»">← Гид</a><span class="brand">JURT</span><h1>Масджид аль-Харам</h1><button class="go" id="go">8 шагов умры</button></header>
<div id="chips"></div>
<div id="counter"></div>
<div id="prog"><div class="lbl" id="plbl"></div><div class="trk"><div class="fill" id="pfill"></div></div></div>

<div class="bar" id="bar">
  <button data-view="kaaba" class="on">Кааба</button>
  <button data-view="haram">Весь Харам</button>
  <button data-view="sai">Сафа — Марва</button>

</div>

  <button id="close" aria-label="Закрыть">×</button>
  <div class="tag" id="ctag"></div>
  <h2 id="ctitle"></h2>
  <div id="ctext"></div>
  <div class="nav"><button id="prev">← Назад</button><button id="next">Далее →</button></div>
  <p class="note">Тексты — по «Гиду паломника» (ханафитский фикх). Схема, улицы и пешеходный путь по картам © OpenStreetMap (ODbL), высоты сверены с 2ГИС.</p>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// Точки-подсказки по порядку тавафа (против часовой: Кааба слева), координаты — из OSM, метры от центра Каабы
const SPOTS = [
  { key: "black_stone", tag: "Таваф · старт", title: "Чёрный камень",
    text: `<p>Аль-Хаджар аль-Асвад в серебряной оправе — восточный угол Каабы. От него начинается и им заканчивается каждый из 7 кругов.</p>
<p><b>Истилям:</b> встаньте лицом к камню, поднимите руку ладонью к нему, скажите — и поцелуйте ладонь. Не пробивайтесь к камню: жест издали засчитывается.</p>
<p class="dua">Бисмилляхи ва-Ллаху акбар</p>
<p class="src">аль-Бухари, № 1613; аль-Байхаки от Ибн Умара. ⚑ Сверить: одна правая рука или обе ладони.</p>`, dist: 34 },
  { key: "green_lamp", tag: "Ориентир", title: "Зелёная лампа",
    text: `<p>На стене мечети напротив Чёрного камня горит зелёная лампа. В толпе камня часто не видно — ориентируйтесь на неё: поравнялись с ней — круг начался или закончился.</p>
<p>Оранжевая линия на схеме условная: на полу матафа полосы сейчас нет.</p>`, dist: 70 },
  { key: "multazam", tag: "Место дуа", title: "Мультазам",
    text: `<p>Участок стены около 2 м между Чёрным камнем и дверью. Здесь просят Аллаха о самом важном.</p>
<p>Если свободно — после тавафа можно прижаться к стене грудью и ладонями. Если тесно — делайте дуа, стоя поодаль.</p>`, dist: 30 },
  { key: "door", tag: "Кааба", title: "Дверь Каабы",
    text: `<p>Золотая дверь на северо-восточной стене, около 2 м над полом. Её открывают редко — для омовения Каабы.</p>
<p>Над дверью — расшитый золотом занавес (ситара).</p>`, dist: 30 },
  { key: "hijr", tag: "Важно для тавафа", title: "Хиджр Исмаила (Хатым)",
    text: `<p>Полукруглая стена высотой около 1,3 м. Пространство внутри относится к Каабе.</p>
<p><b>Таваф — только снаружи Хиджра.</b> Круг, пройденный через Хиджр, не засчитывается — его нужно повторить.</p>`, dist: 38 },
  { key: "mizab", tag: "Кааба", title: "Мизаб ар-Рахма",
    text: `<p>Золотой водосток на крыше Каабы. Смотрит на Хиджр: дождевая вода стекает именно туда.</p>`, dist: 36 },
  { key: "yemeni", tag: "Таваф", title: "Йеменский угол",
    text: `<p>Рукн аль-Ямани — южный угол Каабы, последний перед Чёрным камнем.</p>
<p>Если свободно — коснитесь его рукой, не целуя. Если тесно — проходите: издали жест не делают.</p>
<p>От него до Чёрного камня читают:</p><p class="dua">Раббана атина фи-д-дунья хасанатан ва фи-ль-ахырати хасанатан ва кына ‘азаба-н-нар</p>
<p class="src">Коран 2:201; Абу Дауд, № 1892.</p>`, dist: 30 },
  { key: "maqam", tag: "После тавафа · ваджиб", title: "Макам Ибрахим",
    text: `<p>Камень со следами стоп пророка Ибрахима (мир ему) — в золотой оправе.</p>
<p>После 7 кругов закройте правое плечо и совершите 2 ракаата позади Макама, лицом к Каабе (Коран 2:125). Читают суры «аль-Кафирун» и «аль-Ихлас».</p>
<p>Тесно — молитесь в любом месте мечети. Если сейчас время, когда намаз запрещён, — подождите, пока оно пройдёт.</p>`, dist: 34 },
  { key: "safa", tag: "Саи · старт", title: "Сафа",
    text: `<p>Холм, с которого начинается саи (ваджиб). Подходя, читают Коран 2:158 и:</p>
<p class="dua">Абда’у бима бада’а-Ллаху бих</p>
<p class="src">Муслим, № 1218.</p>
<p>На Сафе встаньте лицом к Каабе, поднимите руки, трижды «Аллаху акбар», «Ля иляха илляллах» — и дуа своими словами.</p>
<p>Сафа → Марва — 1 проход, обратно — 2-й. Всего 7, около 2,8 км.</p>`, dist: 150 },
  { key: "marwa", tag: "Саи · финиш", title: "Марва",
    text: `<p>Седьмой проход заканчивается на Марве. На Марве — то же, что на Сафе: лицом к Каабе, такбир, дуа.</p>
<p>Между зелёными огнями в галерее мужчины идут быстрым шагом, женщины — обычным:</p>
<p class="dua">Рабби-гфир ва-рхам, иннака Анта-ль-а‘аззу-ль-акрам</p>
<p>Вуду для саи желательно, но не обязательно. Устали — можно отдохнуть, есть коляски.</p>`, dist: 150 },
  { key: "hotel", tag: "Наш отель", title: "Address Jabal Omar", p: [-806, -40, 150],
    text: `<p>Здесь живёт группа. Это две башни, а наверху между ними — мост с молельным залом.</p>
<p>Оранжевая линия — путь пешком по тротуарам: аллея между башнями, вдоль ул. Умм аль-Кура, переход через ул. Ибрахим аль-Халиль и площадь — до ворот короля Фахда (№ 79) около 670 м, это 9–12 минут. Дальше — через мечеть к Чёрному камню.</p>
<p>Светлая линия — верхний вариант: пандус и мост аш-Шубайка, вход сразу на 1-й этаж (около 730 м).</p>
<p>Линия — схема по карте OSM. В толпе проходы иногда перекрывают, поэтому держитесь группы.</p>`, dist: 420 },
];

// 8 шагов умры на той же сцене. view: [цель, расстояние, направление]; spots: какие метки видны; fx — эффект шага
const STEPS = [
  { title: "Ихрам и намерение", tag: "Шаг 1 · Медина → микат", fx: "ihram", spots: [],
    text: `<p>В отеле в Медине — гусль, мужчины надевают два белых полотна ихрама.</p>
<p>На микате Зуль-Хулейфа — 2 ракаата ихрама (сунна; «аль-Кафирун» и «аль-Ихлас»), затем намерение:</p>
<p class="dua">Аллахумма инни уриду-ль-‘умрата фа-йассирха ли ва-такаббальха минни</p>
<p>И сразу тальбия — с этого момента действуют запреты ихрама:</p>
<p class="dua">Ляббайка-Ллахумма ляббайк. Ляббайка ля шарика ляка ляббайк. Инна-ль-хамда ва-н-ни‘мата ляка ва-ль-мульк. Ля шарика лак.</p>
<p class="src">Намерение — по «аль-Хидае»; тальбия — аль-Бухари, № 1549; Муслим, № 1184. Тальбию читают до начала тавафа.</p>` },
  { title: "Вход в Харам", tag: "Шаг 2 · мечеть", fx: "enter", spots: [],
    text: `<p>Оранжевая линия — путь из нашего отеля Address Jabal Omar до ворот короля Фахда (№ 79), около 670 м, и дальше к Чёрному камню. Жёлтая точка — это вы, над ней — сколько осталось.</p>
<p>Дорогу переходите только в отмеченном месте — через ул. Ибрахим аль-Халиль, там нет «зебры». Светлая линия — верхний вариант: пандус и мост аш-Шубайка на 1-й этаж.</p>
<p>Плечи в ихраме пока закрыты — правое открывают только перед тавафом.</p>
<p>Запомните номер ворот — сфотографируйте табличку: это ваша точка сбора с группой. Обувь — в пакет с собой.</p>
<p>Входите правой ногой:</p>
<p class="dua">Бисмилляхь, ва-с-саляту ва-с-саляму ‘аля расулиллях. Аллахумма-фтах ли абваба рахматик</p>
<p class="src">Муслим, № 713; Абу Дауд, № 465.</p>
<p>Увидев Каабу — поднимите руки: «Аллаху акбар, ля иляха илляллах» — и попросите о самом важном.</p>` },
  { title: "Таваф — 7 кругов", tag: "Шаг 3 · ваджиб и фард", fx: "tawaf", spots: [0, 1, 4, 6],
    text: `<p>Белая фигурка с золотым сиянием — это вы. Только с вуду. Мужчины — правое плечо открыто все 7 кругов (идтиба), первые 3 круга — быстрым шагом (рамаль), если позволяет толпа.</p>
<p>Старт — напротив Чёрного камня (зелёная лампа), Кааба всё время слева, Хиджр — снаружи. На старте каждого круга — истилям.</p>
<p>Первые 4 круга — фард, ещё 3 — ваджиб. Сбились со счёта — берите меньшее число.</p>
<p class="src">⚑ Начинать от камня: у ханафитов одни считают это ваджибом, другие — сунной.</p>` },
  { title: "2 ракаата у Макама", tag: "Шаг 4 · ваджиб", fx: "maqam", spots: [7],
    text: `<p>Закройте правое плечо. Встаньте так, чтобы Макам Ибрахим был между вами и Каабой (Коран 2:125).</p>
<p>2 ракаата: «аль-Кафирун» и «аль-Ихлас». Тесно — в любом месте мечети. Время, когда намаз запрещён, — переждите.</p>` },
  { title: "Вода Замзам", tag: "Шаг 5 · сунна", fx: "zamzam", spots: [],
    text: `<p>Кулеры с Замзамом стоят по краю матафа. Пейте вдоволь, лицом к Каабе, в три глотка, начиная с «Бисмиллях»; немного воды — на голову и лицо.</p>
<p class="src">«Вода Замзам — для того, ради чего её пьют» — Ибн Маджа, № 3062.</p>
<p>Затем — истилям издали в сторону камня (сунна) и к Сафе.</p>` },
  { title: "Саи — Сафа и Марва", tag: "Шаг 6 · ваджиб", fx: "sai", spots: [8, 9],
    text: `<p>Оранжевая метка — это вы. Сафа → Марва — 1-й проход, обратно — 2-й… 7-й заканчивается на Марве. Около 2,8 км.</p>
<p>На Сафе и Марве — лицом к Каабе, руки подняты, трижды такбир, тахлиль, дуа. Между зелёными огнями мужчины идут быстрым шагом.</p>
<p>Вуду желательно, но не обязательно. Можно отдыхать, есть коляски.</p>` },

});
let playing = true;
$("play").onclick = () => { playing = !playing; $("play").textContent = (playing ? "❚❚" : "▶") + " Таваф"; };

{ const [t, d, dir] = VIEWS.kaaba; controls.target.copy(t); camera.position.copy(t).add(dir.clone().normalize().multiplyScalar(d)); }

// Видимость меток: прячем за зданиями (проверка лучом раз в несколько кадров)
const ray = new THREE.Raycaster(), proj = new THREE.Vector3();
const shown = (o) => { for (; o; o = o.parent) if (!o.visible) return false; return true; };   // скрытые слои меток не заслоняют
let frame = 0;
function updateSpots() {
  const w = innerWidth, h = innerHeight, check = frame++ % 8 === 0;
  const far = camera.position.distanceTo(controls.target) > 260;   // издали метки у Каабы сливаются — оставляем 1, 9, 10
  SPOTS.forEach((s, i) => {
    const el = spotEls[i];
    proj.copy(s.pos).project(camera);
    if ((step >= 0 ? !STEPS[step].spots.includes(i) : far && i > 0 && i < 8 && cur !== i) || proj.z > 1 || Math.abs(proj.x) > 1.1 || Math.abs(proj.y) > 1.1) { el.classList.add("off"); return; }
    el.classList.remove("off");
    el.style.transform = `translate(${(proj.x + 1) / 2 * w}px, ${(1 - proj.y) / 2 * h}px)`;
    if (check) {
      const dir = s.pos.clone().sub(camera.position), dist = dir.length();
      ray.set(camera.position, dir.normalize()); ray.far = dist - 2.5;
      el.classList.toggle("hid", ray.intersectObjects(occluders, false).some((h) => shown(h.object)));
    }
  });
}

let simT = 0, last = performance.now(), viewShift = 0;
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) simT += dt;
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);
    controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromC, fly.toC, e);
    if (k >= 1) fly = null;
  }
  const want = $("card").classList.contains("open") ? 0.2 : 0;   // сдвигаем картинку вверх над карточкой
  if (Math.abs(want - viewShift) > 0.001) {
    viewShift += (want - viewShift) * Math.min(1, dt * 6);
    camera.setViewOffset(innerWidth, innerHeight, 0, viewShift * innerHeight, innerWidth, innerHeight);
  }
  controls.update();
  placeWalkers(simT);
  updateFx(dt);
  for (const c of comets) {
    const base = (c.phase + simT / 9) * c.lane.L;
    c.parts.forEach((s, j) => { const p = along(c.lane, base - j * 0.9, tmpV); s.position.set(p.x, 0.9, -p.y); });
  }
  for (let i = 0; i < SPARKS; i++) {
    const v = Math.max(0, Math.sin(simT * 1.6 + sparkPh[i])) ** 3;
    sparkCol.set([v, v * 0.93, v * 0.82], i * 3);
  }
  sparkGeo.attributes.color.needsUpdate = true;
  if (startMat) startMat.emissiveIntensity = 1.6 + Math.sin(simT * 3) * 0.9;
  lampGlow.material.opacity = 0.75 + Math.sin(simT * 2.2) * 0.25;
  renderer.render(scene, camera);
  updateSpots();
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; viewShift += 0.0011; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); fitHotel();
});
renderer.domElement.addEventListener("pointerdown", () => { fly = null; });
</script>
</body>
