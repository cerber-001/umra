<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Харам 3D — JURT</title>
<link rel="preload" href="../exo2-semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Exo 2 локально (те же файлы, что в «Гиде паломника»), лицензия OFL */
  @font-face { font-family: "Exo 2"; font-weight: 400; font-display: swap; src: url(../exo2-regular.woff2) format("woff2"); }
  @font-face { font-family: "Exo 2"; font-weight: 600; font-display: swap; src: url(../exo2-semibold.woff2) format("woff2"); }
  @font-face { font-family: "Exo 2"; font-weight: 700; font-display: swap; src: url(../exo2-bold.woff2) format("woff2"); }
  :root {
    --sapphire: #005A5C; --deep: #00292C; --orange: #F07A1E; --copper: #E9A06A; --cream: #F4EDE1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--cream);
    font-family: "Exo 2", system-ui, sans-serif; }
  #bg { position: fixed; inset: 0; background: url(bg.webp) center/cover no-repeat; }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,20,22,.75) 100%); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
    background: linear-gradient(var(--deep), transparent); }
  header .back { pointer-events: auto; font: 600 13px "Exo 2", sans-serif; color: var(--cream); text-decoration: none;
    background: rgba(0,90,92,.85); border-radius: 10px; padding: 8px 10px; }
  header .brand { font-weight: 700; letter-spacing: .14em; color: var(--copper); font-size: 13px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 6px; padding: 5px; border-radius: 14px; background: rgba(0,41,44,.82);
    backdrop-filter: blur(8px); border: 1px solid rgba(233,160,106,.25); transition: opacity .25s; }
  .bar button { font: 600 13px "Exo 2", sans-serif; color: var(--cream); background: transparent; border: 0;
    padding: 9px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .bar button.on { background: var(--sapphire); }
  .spot { position: fixed; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    display: grid; place-items: center; font: 700 14px "Exo 2", sans-serif; color: var(--deep);
    background: var(--cream); border: 2px solid var(--copper); cursor: pointer; padding: 0;
    box-shadow: 0 0 0 0 rgba(233,160,106,.6); animation: pulse 2.4s infinite; transition: opacity .2s; }
  .spot::before { content: ""; position: absolute; inset: -8px; }
  .spot.hid { opacity: .28; animation: none; }
  .spot.off { display: none; }
  .spot.sel { background: var(--orange); color: #fff; border-color: #fff; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233,160,106,.55); } 70% { box-shadow: 0 0 0 10px rgba(233,160,106,0); } 100% { box-shadow: 0 0 0 0 rgba(233,160,106,0); } }
  #card { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); max-width: 460px;
    margin: 0 auto; padding: 16px 16px 14px; border-radius: 18px; background: rgba(0,41,44,.94);
    border: 1px solid rgba(233,160,106,.35); backdrop-filter: blur(10px);
    transform: translateY(130%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  #card.open { transform: none; }
  #card .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--copper); }
  #card h2 { margin: 4px 36px 8px 0; font-size: 20px; line-height: 1.2; }
  #card h2 b { color: var(--orange); margin-right: 6px; }
  #card p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.45; color: #E8E1D4; }
  #card .dua { padding: 8px 10px; border-left: 3px solid var(--orange); background: rgba(0,90,92,.45);
    border-radius: 0 8px 8px 0; font-style: italic; }
  #card .nav { display: flex; justify-content: space-between; margin-top: 10px; }
  #card .nav button, #close { font: 600 13px "Exo 2", sans-serif; color: var(--cream); background: var(--sapphire);
    border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0; font-size: 18px; }
  #card { max-height: 58vh; overflow-y: auto; overscroll-behavior: contain; }
  #card .src { font-size: 12px; color: rgba(244,237,225,.62); }
  /* «Пройти умру» — главная кнопка-действие: крупная, внизу по центру над панелью видов, с ▶ и подписью.
     Не в шапке — там её читали как заголовок. В режиме шагов превращается в маленькую «✕ Выйти» справа сверху */
  #go { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 12px;
    font: 700 17px "Exo 2", sans-serif; color: #fff; text-align: left; white-space: nowrap; cursor: pointer;
    background: linear-gradient(#F68A34, var(--orange)); border: 2px solid rgba(255,255,255,.75); border-radius: 30px;
    padding: 10px 22px 10px 12px; animation: goPulse 2.2s infinite; box-shadow: 0 6px 22px rgba(240,122,30,.55), inset 0 -3px 0 rgba(0,0,0,.15); }
  #go .ic { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #fff; flex: none; }
  #go .ic::before { content: ""; border-style: solid; border-width: 8px 0 8px 13px; border-color: transparent transparent transparent var(--orange); margin-left: 4px; }
  #go small { display: block; font: 500 12px "Exo 2", sans-serif; opacity: .9; margin-top: 1px; }
  #go:active { transform: translateX(-50%) translateY(2px); }
  #go:hover { filter: brightness(1.06); }
  #go.on { left: auto; right: 16px; bottom: auto; top: max(14px, env(safe-area-inset-top)); transform: none; animation: none; gap: 6px;
    font-size: 13px; padding: 8px 12px; border-width: 1px; border-color: rgba(233,160,106,.5); background: var(--sapphire); box-shadow: none; }
  #go.on .ic, #go.on small { display: none; }
  #go.hide { display: none; }
  @keyframes goPulse { 0% { box-shadow: 0 0 0 0 rgba(240,122,30,.7), 0 6px 22px rgba(240,122,30,.55); }
    70% { box-shadow: 0 0 0 14px rgba(240,122,30,0), 0 6px 22px rgba(240,122,30,.55); } 100% { box-shadow: 0 0 0 0 rgba(240,122,30,0), 0 6px 22px rgba(240,122,30,.55); } }
  @media (max-width: 420px) { header .brand { display: none; } header h1 { font-size: 15px; } #go { font-size: 16px; } }
  /* Шаг 1: выбор маршрута до миката и схема микатов */
  #card .from { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; }
  #card .from button { font: 600 12.5px "Exo 2", sans-serif; color: var(--cream); background: rgba(0,90,92,.55);
    border: 1px solid rgba(233,160,106,.45); border-radius: 18px; padding: 6px 11px; cursor: pointer; }
  #card .from button.sel { background: var(--orange); border-color: #fff; color: #fff; }
  #ctext .fb { display: none; }
  #ctext[data-from="medina"] .fb.medina, #ctext[data-from="jeddah"] .fb.jeddah, #ctext[data-from="transit"] .fb.transit, #ctext[data-from="stay"] .fb.stay, #ctext[data-from="mecca"] .fb.mecca, #ctext[data-from="missed"] .fb.missed { display: block; }
  #card .mp { display: block; width: 100%; max-width: 340px; margin: 2px auto 8px; }
  .mp .r { opacity: .14; transition: opacity .3s; }
  #ctext[data-from="medina"] .mp .medina, #ctext[data-from="jeddah"] .mp .jeddah, #ctext[data-from="transit"] .mp .transit, #ctext[data-from="stay"] .mp .stay, #ctext[data-from="mecca"] .mp .mecca, #ctext[data-from="missed"] .mp .missed { opacity: 1; }
  #chips { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 42px); left: 0; right: 0; display: none;
    justify-content: center; gap: 6px; padding: 0 12px; }
  #chips.on { display: flex; }
  #chips button { width: 32px; height: 32px; border-radius: 50%; padding: 0; font: 700 13px "Exo 2", sans-serif;
    color: var(--cream); background: rgba(0,41,44,.85); border: 1px solid rgba(233,160,106,.45); cursor: pointer; }
  #chips button.done { background: var(--sapphire); }
  #chips button.sel { background: var(--orange); border-color: #fff; color: #fff; }
  #counter { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 84px); left: 50%; transform: translateX(-50%);
    display: none; padding: 6px 14px; border-radius: 20px; font: 600 14px "Exo 2", sans-serif; color: #fff;
    background: rgba(240,122,30,.92); white-space: nowrap; }
  #runTag { position: fixed; left: 0; top: 0; display: none; padding: 3px 9px; border-radius: 12px; pointer-events: none;
    font: 600 12px "Exo 2", sans-serif; color: var(--deep); background: #FFD27A; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #prog { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 120px); left: 50%; transform: translateX(-50%);
    width: min(300px, calc(100vw - 32px)); display: none; pointer-events: none;
    padding: 5px 10px 7px; border-radius: 12px; background: rgba(0,41,44,.82); }
  #prog.on { display: block; }
  #prog .lbl { font: 600 12px "Exo 2", sans-serif; color: var(--cream); text-align: center; margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #prog .trk { position: relative; height: 8px; border-radius: 4px; background: rgba(0,41,44,.85); border: 1px solid rgba(233,160,106,.4); overflow: hidden; }
  #prog .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #E9A06A, #FFD27A); }
  #prog .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,41,44,.9); }
  #card .note { font-size: 11px; color: rgba(244,237,225,.5); margin: 6px 0 0; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--copper); }
  #fallback { position: fixed; inset: 0; display: none; background: url(poster.webp) center/cover; }
  /* Карточка шага по умолчанию свёрнута: заголовок и кнопки, сцену видно; «Подробнее» — весь текст */
  #card.mini #ctext, #card.mini .note { display: none; }
  #card.mini h2 { margin-bottom: 2px; }
  #card .nav #more { background: transparent; color: var(--copper); padding: 8px 6px; }
  /* Кнопки видов переносятся во 2-ю строку на узком экране */
  .bar { flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 24px); }
  @media (max-width: 480px) { .bar button { padding: 8px 9px; font-size: 12px; } }
  #layers { position: fixed; right: 12px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px); width: min(300px, calc(100vw - 24px));
    max-height: 60vh; overflow-y: auto; display: none; padding: 10px 12px; border-radius: 14px; background: rgba(0,41,44,.94);
    border: 1px solid rgba(233,160,106,.35); backdrop-filter: blur(8px); font-size: 13.5px; }
  #layers.on { display: block; }
  #layers b { display: block; color: var(--copper); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
  #layers label { display: flex; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; }
  #layers input { accent-color: #F07A1E; width: 17px; height: 17px; }
  #layers p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; color: #E8E1D4; }
  #layers p:empty { display: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="fallback"></div>
<div id="load">Загружаем Харам…</div>
<header><a class="back" href="../" aria-label="Вернуться в «Гид паломника»">← Гид</a><span class="brand">JURT</span><h1>Масджид аль-Харам</h1></header>
<button id="go"></button>
<div id="chips"></div>
<div id="counter"></div>
<div id="prog"><div class="lbl" id="plbl"></div><div class="trk"><div class="fill" id="pfill"></div></div></div>
<div id="runTag"></div>
<div id="spots"></div>
<div class="bar" id="bar">
  <button data-view="kaaba" class="on">Кааба</button>
  <button data-view="haram">Весь Харам</button>
  <button data-view="sai">Сафа — Марва</button>
  <button data-view="hotel">Отель → Кааба</button>
  <button id="play">❚❚ Таваф</button>
  <button id="lyrBtn">Слои</button>
</div>
<div id="layers"><b>Что показать на схеме</b>
  <label><input type="checkbox" data-l="umra" checked> Умра: метки 1–11</label>
  <label><input type="checkbox" data-l="gates"> Ворота и их номера</label>
  <label><input type="checkbox" data-l="wc"> Туалеты</label>
  <label><input type="checkbox" data-l="esc"> Эскалаторы и лифты</label>
  <label><input type="checkbox" data-l="all"> Все объекты (и исторические места)</label>
  <p id="linfo"></p>
</div>
<div id="card" role="dialog" aria-live="polite">
  <button id="close" aria-label="Закрыть">×</button>
  <div class="tag" id="ctag"></div>
  <h2 id="ctitle"></h2>
  <div id="ctext"></div>
  <div class="nav"><button id="prev">← Назад</button><button id="more">Подробнее ▾</button><button id="next">Далее →</button></div>
  <p class="note">Тексты — по «Гиду паломника» (ханафитский фикх). Схема, улицы и пешеходный путь по картам © OpenStreetMap (ODbL).</p>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// Точки-подсказки по порядку тавафа (против часовой: Кааба слева), координаты — из OSM, метры от центра Каабы
const SPOTS = [
  { key: "black_stone", tag: "Таваф · старт", title: "Чёрный камень",
    text: `<p>Аль-Хаджар аль-Асвад в серебряной оправе — восточный угол Каабы. От него начинается и им заканчивается каждый из 7 кругов.</p>
<p><b>Истилям:</b> встаньте лицом к камню, поднимите обе руки ладонями к нему, как в такбире, скажите — и поцелуйте ладони. Не пробивайтесь к камню: жест издали засчитывается.</p>
<p class="dua">Бисмилляхи ва-Ллаху акбар</p>
<p>Поцеловать сам камень — сунна, только если никого не толкать: у камня целуют по одному, в очереди вдоль стены. Женщинам в толчею среди мужчин не идти — достаточно жеста издали.</p>
<p class="src">аль-Бухари, № 1613; аль-Байхаки от Ибн Умара.</p>`, dist: 15, dir: new THREE.Vector3(0.96, 0.42, 0.27) },
  { key: "green_lamp", tag: "Ориентир", title: "Зелёная лампа", dz: 3.2,
    text: `<p>На стене мечети напротив Чёрного камня горит зелёная лампа — от камня до неё около 65 м. В толпе камня часто не видно — ориентируйтесь на лампу: поравнялись с ней — круг начался или закончился.</p>
<p>Оранжевая линия на схеме условная: на полу матафа полосы сейчас нет.</p>`, dist: 40, dir: new THREE.Vector3(-0.936, 0.45, -0.35) },
  { key: "multazam", tag: "Место дуа", title: "Мультазам",
    text: `<p>Участок стены около 2 м между Чёрным камнем и дверью (подсвечен). Здесь просят Аллаха о самом важном.</p>
<p>Если свободно — после тавафа можно прижаться к стене грудью, щекой и ладонями. Если тесно — делайте дуа, стоя поодаль.</p>`, dist: 13 },
  { key: "door", tag: "Кааба", title: "Дверь Каабы",
    text: `<p>Золотая дверь на северо-восточной стене, около 2 м над полом. Её открывают редко — для омовения Каабы.</p>
<p>Над дверью — расшитый золотом занавес (ситара).</p>`, dist: 17 },
  { key: "hijr", tag: "Важно для тавафа", title: "Хиджр Исмаила (Хатым)",
    text: `<p>Полукруглая стена высотой около 1,3 м. Пространство внутри относится к Каабе.</p>
<p><b>Таваф — только снаружи Хиджра.</b> Круг, пройденный через Хиджр, не засчитывается — его нужно повторить.</p>
<p>Внутри молятся по очереди: вход с одной стороны, выход с другой. Помолились — уступите место и вернитесь к тавафу.</p>`, dist: 38 },
  { key: "mizab", tag: "Кааба", title: "Мизаб ар-Рахма",
    text: `<p>Золотой водосток на крыше Каабы. Смотрит на Хиджр: дождевая вода стекает именно туда.</p>
<p>Молиться в Хиджре — всё равно что внутри Каабы: Хиджр — часть Дома. В книгах о хадже, в том числе ханафитских, место под Мизабом называют среди мест, где дуа принимается. Молитесь там, где свободно, и не толкайтесь.</p>
<p class="src">Абу Дауд, № 2028; ат-Тирмизи, № 876.</p>`, dist: 30 },
  { key: "yemeni", tag: "Таваф", title: "Йеменский угол",
    text: `<p>Рукн аль-Ямани — южный угол Каабы, последний перед Чёрным камнем. Кисва здесь подрезана — виден камень стены.</p>
<p>Если свободно — коснитесь угла правой рукой (или обеими), не целуя. Если тесно — проходите: издали жест не делают.</p>
<p>От него до Чёрного камня читают:</p><p class="dua">Раббана атина фи-д-дунья хасанатан ва фи-ль-ахырати хасанатан ва кына ‘азаба-н-нар</p>
<p class="src">Коран 2:201; Абу Дауд, № 1892.</p>`, dist: 30 },
  { key: "maqam", tag: "После тавафа · ваджиб", title: "Макам Ибрахим",
    text: `<p>Камень со следами стоп пророка Ибрахима (мир ему) — в золотой оправе.</p>
<p>После 7 кругов закройте правое плечо и совершите 2 ракаата позади Макама, лицом к Каабе (Коран 2:125). Читают суры «аль-Кафирун» и «аль-Ихлас».</p>
<p>Тесно — молитесь в любом месте мечети. Если сейчас время, когда намаз запрещён, — подождите, пока оно пройдёт.</p>`, dist: 34 },
  { key: "safa", tag: "Саи · старт", title: "Сафа",
    text: `<p>Холм, с которого начинается саи (ваджиб). Подходя, читают Коран 2:158 и:</p>
<p class="dua">Абда’у бима бада’а-Ллаху бих</p>
<p class="src">Муслим, № 1218.</p>
<p>На Сафе встаньте лицом к Каабе, поднимите руки, трижды «Аллаху акбар», «Ля иляха илляллах» — и дуа своими словами.</p>
<p>Сафа → Марва — 1 проход, обратно — 2-й. Всего 7 проходов по ~380 м, около 2,7 км.</p>`, dist: 150 },
  { key: "marwa", tag: "Саи · финиш", title: "Марва",
    text: `<p>Седьмой проход заканчивается на Марве. На Марве — то же, что на Сафе: лицом к Каабе, такбир, дуа.</p>
<p>Между зелёными огнями в галерее мужчины идут быстрым шагом, женщины — обычным:</p>
<p class="dua">Рабби-гфир ва-рхам, иннака Анта-ль-а‘аззу-ль-акрам</p>
<p>Вуду для саи желательно, но не обязательно. Устали — можно отдохнуть, есть коляски.</p>`, dist: 150 },

function glowTex() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.55)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity,

  s.scale.setScalar(size); return s;
};

  o.castShadow = ["kiswa", "gold", "marble", "minaret"].includes(m.name);

});

{ // османская галерея (риваки конца XVI в., восстановлены при расширении) — всегда на схеме, по контуру открытого матафа из OSM

  const BAY = 4.6, DEEP = 7, cols = [], domes = [];

    const [x1, y1] = RIM[(i + 1) % RIM.length], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(L / BAY));
